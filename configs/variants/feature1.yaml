variants:
  - name: bf16
    method: bf16

  - name: int8_w8a8
    method: int8
    bits: 8
    scheme: W8A8
    ignore: &text_calibration_ignore
      - lm_head
      - "re:.*visual.*"
      - "re:.*embed_tokens$"

  - name: gptq_w4a16_g128
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 128
    ignore: *text_calibration_ignore

  - name: gptq_w4a16_g64
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 64
    ignore: *text_calibration_ignore

  - name: gptq_w4a16_g32
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 32
    ignore: *text_calibration_ignore

  - name: awq_w4a16_g128
    method: awq
    scheme: W4A16_ASYM
    bits: 4
    group_size: 128
    ignore: *text_calibration_ignore

  - name: autoround_w4a16_g128
    method: autoround
    scheme: W4A16
    bits: 4
    group_size: 128
    ignore: *text_calibration_ignore
    # AutoRound's own default: 128 samples of 2,048 tokens (the first 128 of the packed set).
    # It caches every sample's block inputs and outputs on the GPU, so the full set does not fit.
    calibration_samples: 128

  # Glaze v2 (src/qwen35_compression/glaze2): quantized from BF16 on BF16's own answers to
  # in-domain prompts, Fisher-weighted learned rounding, and the bytes an 8-bit vision tower frees
  # spent on the language model's most sensitive layers; no larger than AutoRound's export.
  - name: glaze2_w4a16_g128
    method: glaze2
    scheme: W4A16
    bits: 4
    group_size: 128
    ignore: *text_calibration_ignore
    glaze2: &glaze2_4b
      calibration_blocks: outputs/feature1/glaze2/data/calibration.jsonl
      held_out_blocks: outputs/feature1/glaze2/data/held_out.jsonl
      byte_target: autoround_w4a16_g128
      allocate: true
      margin_bytes: 2000000
      blocks_per_batch: 8
      max_iters: 400
      min_iters: 50
      eval_every: 25
      lr: 0.005
      fisher_chunk_tokens: 512
      seed: 42

  # Its pilot: every stage on 16 calibration and 8 held-out blocks, 10 iterations per layer.
  - name: glaze2_pilot_w4a16_g128
    method: glaze2
    scheme: W4A16
    bits: 4
    group_size: 128
    ignore: *text_calibration_ignore
    glaze2:
      <<: *glaze2_4b
      calibration_blocks: outputs/feature1/glaze2_pilot/data/calibration.jsonl
      held_out_blocks: outputs/feature1/glaze2_pilot/data/held_out.jsonl
      max_iters: 10
      min_iters: 5
      eval_every: 5

  # Glaze v1: AutoRound's export with its group scales and norm weights retrained end to end
  # against BF16 (KL on next-token distributions), one BF16 grid step at a time. Trained on the
  # same 128 packed calibration blocks AutoRound used, so only the objective differs; the next
  # 32 blocks are the dev set.
  - name: glaze_v1_w4a16_g128
    method: glaze
    scheme: W4A16
    bits: 4
    group_size: 128
    ignore: *text_calibration_ignore
    init: autoround_w4a16_g128
    glaze:
      data: calibration
      train_blocks: 128
      dev_blocks: 32
      epochs: 4
      tokens_per_step: 16384
      micro_batch_tokens: 8192
      flip_fractions: [0.00001, 0.00002, 0.00004]
      momentum: 0.9
      max_relative_change: 0.01
      probe_steps: 8
      warmup_steps: 3
      train_norms: true
      logit_chunk_tokens: 512
      eval_every_steps: 16
      seed: 42
      max_memory_fraction: 0.85
      max_train_minutes: 30

  # B1b: as B1, but trained on 120 packed blocks AutoRound never saw (160-279), with B1's dev set.
  # AutoRound's export has KL ~0.008 on its own 128 calibration blocks and 0.035 on held-out ones;
  # B1, trained where the init is already that close, never lowered the held-out KL.
  - name: glaze_v1b_w4a16_g128
    method: glaze
    scheme: W4A16
    bits: 4
    group_size: 128
    ignore: *text_calibration_ignore
    init: autoround_w4a16_g128
    glaze:
      data: calibration
      train_start: 160
      train_blocks: 120
      dev_start: 128
      dev_blocks: 32
      epochs: 4
      tokens_per_step: 16384
      micro_batch_tokens: 8192
      flip_fractions: [0.00001, 0.00002, 0.00004]
      momentum: 0.9
      max_relative_change: 0.01
      probe_steps: 8
      warmup_steps: 3
      train_norms: true
      logit_chunk_tokens: 512
      eval_every_steps: 16
      seed: 42
      max_memory_fraction: 0.85
      max_train_minutes: 30

  # Sensitivity: GPTQ W4A16 g128 on one component of the language model, the rest left in BF16.
  # Targets name exactly the Linear layers the full GPTQ variant quantizes in that component; a
  # looser pattern would also catch the DeltaNet conv1d and norm, the q/k norms, or the vision
  # tower's MLPs. They match on "layers.N.<component>.<projection>" only: transformers names these
  # model.language_model.layers.N... while vLLM names them language_model.model.layers.N... and
  # matches its fused projections (in_proj_qkvz, qkv_proj, gate_up_proj) through their parts.
  - name: sensitivity_deltanet_w4a16_g128
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 128
    targets:
      - "re:.*layers\\.\\d+\\.linear_attn\\.(in_proj_qkv|in_proj_z|in_proj_a|in_proj_b|out_proj)$"

  - name: sensitivity_attention_w4a16_g128
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 128
    targets:
      - "re:.*layers\\.\\d+\\.self_attn\\.(q_proj|k_proj|v_proj|o_proj)$"

  - name: sensitivity_ffn_w4a16_g128
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 128
    targets:
      - "re:.*layers\\.\\d+\\.mlp\\.(gate_proj|up_proj|down_proj)$"

  - name: sensitivity_vision_w4a16_g128
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 128
    targets:
      - "re:.*visual.*"
    requires_multimodal_calibration: true

  - name: mixed_w8_sensitive_w4_standard
    method: mixed
    ignore:
      - lm_head
      - "re:.*embed_tokens.*"
    # Same component patterns as the sensitivity variants (see there).
    groups:
      - name: sensitive_w8
        targets:
          - "re:.*layers\\.\\d+\\.linear_attn\\.(in_proj_qkv|in_proj_z|in_proj_a|in_proj_b|out_proj)$"
        scheme: W8A16
        group_size: 128
      - name: standard_w4
        targets:
          - "re:.*layers\\.\\d+\\.self_attn\\.(q_proj|k_proj|v_proj|o_proj)$"
          - "re:.*layers\\.\\d+\\.mlp\\.(gate_proj|up_proj|down_proj)$"
        scheme: W4A16
        group_size: 128
