variants:
  - name: bf16
    method: bf16

  - name: int8_w8a8
    method: int8
    bits: 8
    scheme: W8A8
    ignore: &text_calibration_ignore
      - lm_head
      - "re:.*visual.*"
      - "re:.*embed_tokens$"

  - name: gptq_w4a16_g128
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 128
    ignore: *text_calibration_ignore

  - name: gptq_w4a16_g64
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 64
    ignore: *text_calibration_ignore

  - name: gptq_w4a16_g32
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 32
    ignore: *text_calibration_ignore

  - name: awq_w4a16_g128
    method: awq
    scheme: W4A16_ASYM
    bits: 4
    group_size: 128
    ignore: *text_calibration_ignore

  - name: autoround_w4a16_g128
    method: autoround
    scheme: W4A16
    bits: 4
    group_size: 128
    ignore: *text_calibration_ignore

  # Sensitivity: GPTQ W4A16 g128 on one component of the language model, the rest left in BF16.
  # Targets name exactly the Linear layers the full GPTQ variant quantizes in that component; a
  # looser pattern would also catch the DeltaNet conv1d and norm, the q/k norms, or the vision
  # tower's MLPs.
  - name: sensitivity_deltanet_w4a16_g128
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 128
    targets:
      - "re:.*language_model\\.layers\\.\\d+\\.linear_attn\\.(in_proj_qkv|in_proj_z|in_proj_a|in_proj_b|out_proj)$"

  - name: sensitivity_attention_w4a16_g128
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 128
    targets:
      - "re:.*language_model\\.layers\\.\\d+\\.self_attn\\.(q_proj|k_proj|v_proj|o_proj)$"

  - name: sensitivity_ffn_w4a16_g128
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 128
    targets:
      - "re:.*language_model\\.layers\\.\\d+\\.mlp\\.(gate_proj|up_proj|down_proj)$"

  - name: sensitivity_vision_w4a16_g128
    method: gptq
    scheme: W4A16
    bits: 4
    group_size: 128
    targets:
      - "re:.*visual.*"
    requires_multimodal_calibration: true

  - name: mixed_w8_sensitive_w4_standard
    method: mixed
    ignore:
      - lm_head
      - "re:.*embed_tokens.*"
    groups:
      - name: sensitive_w8
        targets:
          - "re:.*linear_attn.*"
        scheme: W8A16
        group_size: 128
      - name: standard_w4
        targets:
          - "re:.*self_attn.*"
          - "re:.*mlp.*"
        scheme: W4A16
        group_size: 128
