# Blaze's G4, vision: the full suite's vision tasks that G3 did not already score (MMMU), with
# every setting of configs/evaluation/feature1.yaml. MMBench and MathVista are scored after
# download by the fixed gpt-4o-mini extractor; the rest by VLMEvalKit's rules.
text_tasks: []

vision_tasks:
  - MMBench_DEV_EN_V11
  - MathVista_MINI
  - TextVQA_VAL
  - OCRBench
  - DocVQA_VAL

fewshot: 0
text_backend: vllm
batch_size: "auto"
max_model_len: 12288
vision_max_model_len: 32768
vision_answer_extractor: gpt-4o-mini
vision_extracted_tasks:
  - MMBench_DEV_EN_V11
  - MathVista_MINI
gpu_memory_utilization: 0.85
limit: null
seed: 42
enable_thinking: false
generation:
  do_sample: false
  max_gen_toks: 8192
