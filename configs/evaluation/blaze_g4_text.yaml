# Blaze's G4, text: the full suite's text tasks that G3 did not already score, with every setting
# of configs/evaluation/feature1.yaml. G3's MATH-500 and IFEval answers complete the suite. MMLU-Pro
# runs in full here (G3 scored its 1001-question subset).
text_tasks:
  - mmlu_pro
  - gsm8k
  - hellaswag
  - arc_challenge
  - wikitext

vision_tasks: []

fewshot: 0
text_backend: vllm
batch_size: "auto"
max_model_len: 12288
vision_max_model_len: 32768
gpu_memory_utilization: 0.85
limit: null
seed: 42
enable_thinking: false
generation:
  do_sample: false
  max_gen_toks: 8192
